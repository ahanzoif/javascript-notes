<script>
    setTimeout(function() {
        console.log("Md Kaif");
    }, 3000)

    // setTimeout() core JS language ka part nhi hai,
    // isse browser ka Web API handle krta hai for example (JS V8 Engine)

    // We use setTimeout() when we want to run some code after a specified amount of time.

//*******************************************************//

    // For example:

    console.log("A");

    setTimeout(() => {
    console.log("B");
    }, 2000);

    console.log("C");

    // Output:

    // A
    // C
    // B

    //setTimeout() schedules the function to run later; it doesn't block the rest of your JavaScript code. This is where the event loop becomes important.
</script>
