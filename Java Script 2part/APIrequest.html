<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Request</title>
  </head>
  <body style="background-color: #212121"></body>
  <script>
    // API Request

    const requestUrl = "https://api.github.com/users/ahanzoif";

    // XMLHttpRequest ka object create kiya.
    // Is object ka use server/API ko request bhejne ke liye hota hai.
    const xhr = new XMLHttpRequest();

    xhr.open("GET", requestUrl);
    //open() request ko configure karta hai.
    // GET -> server se data maang rha hai
    // requestUrl -> url/API se data maang rha hai
    // Important: open() request ko actually send nahi karta.
    // Ye sirf request ko prepare/configure karta hai.

    xhr.onreadystatechange = function () {
      console.log(xhr.readyState);
      if (xhr.readyState === 4) {
        const data = JSON.parse(this.responseText);
        console.log(data);
        console.log("Total followers is ", data.followers);
      }
    };
    xhr.send();
  </script>
</html>
