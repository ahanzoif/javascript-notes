        // Event propagation by default hamesha false hota hai
        // There are two types of event propagation
        // 1.Event Bubling (false) -> mostly use
        // 2.Event Capturing (true)

        // Bubling -> Bottom to Top (code track form inside to outside)
        // Capturing -> Top to Bottom (code track from outside to inside)

        //.stopPropagation is used for both Bubbling as well as Capturing

        // If we want to seperate outer or inner from bubling we have to 
        // stop bubling propagation  ->  (.stopPropagation)

// *********************************************

        document.getElementById('google').addEventListener('click',
            function(e) {
             e.preventDefault()
             e.stopPropagation()
             console.log("google clicked"); 
            }, false
        )

        //.preventDefault is used to stop prevents the browser's default action
        // mtlb jab hum .preventDefault use krege tb agr koi link ya kuch v
        //event ke andar hai wo kaam nhi krega wo prevent ho jayega ruk jayega
        //jab hum google pe click kr rhe hai tb google ka link work nhi kr rha hai
